name: Deploy RestoAPI → Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'RestoAPI/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  DOTNET_VERSION: '9.x'
  PROJECT_PATH: 'RestoAPI/src/RestoAPI/RestoAPI.csproj'
  TESTS_PATH:   'RestoAPI/tests/RestoAPI.Tests/RestoAPI.Tests.csproj'
  PUBLISH_DIR:  './api-publish'
  APP_NAME:     'restoapi-app'
  RESOURCE_GROUP: 'restoapi-rg'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Run tests
        run: dotnet test ${{ env.TESTS_PATH }} --configuration Release

      # Framework-dependent publish — App Service has .NET 9 installed.
      # Avoids the 32-bit/64-bit DLL mismatch that self-contained win-x64 causes.
      - name: Publish (framework-dependent)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --output ${{ env.PUBLISH_DIR }}

      - name: Zip publish output
        run: |
          cd ${{ env.PUBLISH_DIR }}
          zip -r ../api-publish.zip .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy via ZIP deploy
        run: |
          az webapp deploy \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --src-path ./api-publish.zip \
            --type zip \
            --async false

      - name: Smoke test
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.APP_NAME }}.azurewebsites.net/api/auth/login \
            -X POST -H "Content-Type: application/json" \
            -d '{"email":"manager@resto.com","password":"password123"}')
          echo "Login endpoint: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
