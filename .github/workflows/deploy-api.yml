name: Deploy RestoAPI → Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'RestoAPI/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.x'
  PROJECT_PATH: 'RestoAPI/src/RestoAPI/RestoAPI.csproj'
  TESTS_PATH:   'RestoAPI/tests/RestoAPI.Tests/RestoAPI.Tests.csproj'
  PUBLISH_DIR:  './api-publish'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Run tests
        run: dotnet test ${{ env.TESTS_PATH }} --configuration Release

      # Self-contained Windows x64 publish — bundles .NET 9 runtime so no
      # runtime needs to be pre-installed on the Windows App Service.
      - name: Publish (self-contained, win-x64)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --self-contained true \
            --runtime win-x64 \
            --output ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
