name: Deploy Website → Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'Website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:   # manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node 20 ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Website/package-lock.json

      # ── 3. Install → Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci
        working-directory: Website

      - name: Build (production)
        run: npm run build
        working-directory: Website
        env:
          # Injected at build time so Vite bakes the URL into the bundle.
          # Set this secret in: GitHub repo → Settings → Secrets → Actions
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── 4. Deploy to Azure Static Web Apps ───────────────────────────────────
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Paths relative to repo root:
          app_location: 'Website'          # where package.json lives
          output_location: 'dist'          # Vite build output (relative to app_location)
          skip_app_build: true             # we built above so Vite env var is applied
