trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: '9.x'
  projectPath: 'src/RestoAPI/RestoAPI.csproj'
  testPath: 'tests/RestoAPI.Tests/RestoAPI.Tests.csproj'

stages:

- stage: Build
  displayName: Build & Test
  jobs:
  - job: BuildTest
    displayName: Build, test and publish artifact
    steps:

    - task: UseDotNet@2
      displayName: Use .NET 9
      inputs:
        version: $(dotnetVersion)

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: $(projectPath)

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: $(projectPath)
        arguments: --configuration $(buildConfiguration) --no-restore

    - task: DotNetCoreCLI@2
      displayName: Test
      inputs:
        command: test
        projects: $(testPath)
        arguments: --configuration $(buildConfiguration) --collect:"XPlat Code Coverage"

    - task: DotNetCoreCLI@2
      displayName: Publish
      inputs:
        command: publish
        projects: $(projectPath)
        arguments: --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/app
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: Upload artifact
      inputs:
        pathToPublish: $(Build.ArtifactStagingDirectory)/app
        artifactName: RestoAPI

